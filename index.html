<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarde</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #263238;
      background: linear-gradient(135deg, #fff3d6, #f7c6a3);
    }
    main {
      width: min(90%, 620px);
      padding: 48px 32px;
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(70, 45, 20, 0.14);
    }
    h1 { margin: 0 0 14px; color: #a64b2a; font-size: clamp(2rem, 6vw, 3rem); }
    p { margin: 0; font-size: 1.1rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>¡Buenas tardes!</h1>
    <p>Bienvenido a mi página web.</p>
  </main>
</body>
</html>
